name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  # The catalog job downloads 145 MB, so it is not run on every push. It is
  # scheduled weekly and can be triggered by hand.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"   # the minimum version pyproject.toml declares
          cache: pip

      - name: Install ruff
        run: python -m pip install ruff

      # --target-version comes from pyproject.toml (py310). Ruff refuses syntax
      # that only works on a newer Python, which is how a backslash inside an
      # f-string — valid from 3.12, a SyntaxError on 3.10 — was caught after it
      # had been in the tree for weeks.
      - name: Ruff
        run: ruff check src/ tests/

  tests:
    name: Tests (with KiCad)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # The acceptance tests verify generated output by asking KiCad itself to
      # read it: `kicad-cli sch export netlist`, `kicad-cli pcb drc`, and Gerber
      # export. KiCad also supplies the symbol and footprint libraries that the
      # generators read at runtime, so this is a real dependency, not a nicety.
      #
      # It has to be KiCad 9. The distribution package on the runner is 7, which
      # rejects the 8/9 board format this project writes ("Unknown token
      # 'generator_version'") and resolves none of the symbol libraries, so a
      # whole test job failed on a tool version that was never what the project
      # was developed against. The PPA provides 9, and the next step asserts it
      # rather than assuming the PPA did what it promised.
      - name: Install KiCad 9 and ngspice
        run: |
          sudo add-apt-repository --yes ppa:kicad/kicad-9.0-releases
          sudo apt-get update
          # kicad-symbols and kicad-footprints are Recommends of kicad, so
          # --no-install-recommends leaves them out; without them every symbol
          # resolves to nothing and the board has no pads. They are the libraries
          # this project actually reads at runtime.
          sudo apt-get install -y --no-install-recommends \
            kicad kicad-symbols kicad-footprints ngspice
          kicad-cli --version
          ngspice --version | head -1

      - name: Assert the KiCad version and libraries
        run: |
          version="$(kicad-cli version)"
          echo "kicad-cli: $version"
          case "$version" in
            9.*) echo "KiCad 9 present" ;;
            *) echo "::error::This project requires KiCad 9; got $version"; exit 1 ;;
          esac
          # The version alone is not enough: the libraries are separate packages.
          test -f /usr/share/kicad/symbols/Device.kicad_sym \
            || { echo "::error::kicad-symbols is missing"; exit 1; }
          test -d /usr/share/kicad/footprints/Resistor_SMD.pretty \
            || { echo "::error::kicad-footprints is missing"; exit 1; }

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Printed for the log, and it fails nobody: the assertions above already
      # guarantee the tools. It is here so a reader can see what the suite will
      # be able to verify without reconstructing it from the install steps.
      - name: Report the environment
        run: python -m src.cli --diagnose

      # DSH_REQUIRE_KICAD=1 turns "kicad-cli missing" from a skip into a failure,
      # so a broken install cannot masquerade as a green build.
      - name: Run test suite
        env:
          DSH_REQUIRE_KICAD: "1"
        run: pytest -q

  catalog-tests:
    name: Tests (with the full component catalog)
    runs-on: ubuntu-latest
    # Not on every push: the catalog is ~145 MB. Weekly, or on demand.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # KiCad supplies the symbol and footprint libraries the generators read at
      # runtime; without them these tests skip instead of running. Same version
      # requirement as the other test job: 9.
      - name: Install KiCad 9 and ngspice
        run: |
          sudo add-apt-repository --yes ppa:kicad/kicad-9.0-releases
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            kicad kicad-symbols kicad-footprints ngspice
          kicad-cli --version
          test -f /usr/share/kicad/symbols/Device.kicad_sym \
            || { echo "::error::kicad-symbols is missing"; exit 1; }

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Download the component catalog
        run: |
          python -m src.cli catalog-setup
          python -m src.cli catalog-status

      # The job's whole purpose is to run these tests against the catalog, and it
      # used to download 373 MB and then skip them all, because the fixtures only
      # looked at JLC_PARTS_CATALOG. Assert that the catalog is visible the way
      # the application and the tests now find it, so a download that lands
      # somewhere unread fails here instead of silently verifying nothing.
      - name: Assert the catalog is visible to the tests
        env:
          DSH_REQUIRE_CATALOG: "1"
        run: |
          python - <<'PY'
          import sys
          from src.components.database import ComponentDatabase
          db = ComponentDatabase()
          if not db.using_jlcparts:
              print("::error::the catalog was downloaded but is not visible to the app")
              sys.exit(1)
          counts = db.internal_category_counts()
          print(f"catalog visible: {sum(counts.values()):,} components "
                f"in {len(counts)} categories")
          PY

      # Several behaviours differ when a real catalog is installed: part
      # substitution returns catalog parts rather than curated ones, and the
      # category taxonomy is derived from the catalog rather than assumed. Those
      # paths are only covered here.
      - name: Run test suite against the real catalog
        env:
          DSH_REQUIRE_KICAD: "1"
        run: pytest -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  compile-check:
    name: Python compile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Cheap guard: catch syntax errors even if a dependency is unavailable.
      - run: python -m compileall -q src main.py
